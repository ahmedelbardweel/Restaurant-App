name: 🍎 Build iOS IPA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # يسمح بتشغيل يدوي من GitHub

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest  # يجب macOS لبناء iOS

    steps:
      # ──────────────────────────────────────────
      # 1. سحب الكود
      # ──────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ──────────────────────────────────────────
      # 2. تثبيت Flutter (أحدث إصدار stable)
      # ──────────────────────────────────────────
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ──────────────────────────────────────────
      # 3. تثبيت الاعتمادات
      # ──────────────────────────────────────────
      - name: 📦 Install Dependencies
        run: flutter pub get

      # ──────────────────────────────────────────
      # 4. تحليل الكود (اختياري - لا يوقف البناء)
      # ──────────────────────────────────────────
      - name: 🔍 Analyze Code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # ──────────────────────────────────────────
      # 5. إعداد CocoaPods cache لتسريع البناء
      # ──────────────────────────────────────────
      - name: 🍫 Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ──────────────────────────────────────────
      # 6. بناء iOS - flutter يتولى CocoaPods تلقائياً
      # ──────────────────────────────────────────
      - name: 🔨 Build iOS (No Code Sign)
        run: |
          flutter build ios --release --no-codesign --verbose

      # ──────────────────────────────────────────
      # 7. تحزيم IPA يدوياً
      # ──────────────────────────────────────────
      - name: 📦 Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r RestaurantApp.ipa Payload
          echo "✅ IPA created successfully!"
          ls -lh RestaurantApp.ipa

      # ──────────────────────────────────────────
      # 8. رفع IPA كـ Artifact
      # ──────────────────────────────────────────
      - name: ⬆️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RestaurantApp-IPA
          path: RestaurantApp.ipa
          retention-days: 30

      # ──────────────────────────────────────────
      # 9. إنشاء Release (فقط عند push على main)
      # ──────────────────────────────────────────
      - name: 🚀 Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Release v${{ github.run_number }}"
          body: |
            ## 🍎 Restaurant App - iOS Build
            
            **Build Number:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            
            ### تحميل التطبيق:
            - حمّل ملف `RestaurantApp.ipa` من المرفقات أدناه
            
            > ⚠️ هذا البناء بدون توقيع رسمي (No Code Signing).
            > لتثبيته على جهاز حقيقي استخدم AltStore أو Sideloadly.
          files: RestaurantApp.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
